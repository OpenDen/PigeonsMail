[package]
name = "mailthin-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
mailthin-core.workspace = true
mailthin-store.workspace = true
mailthin-net.workspace = true
mailthin-render.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
chrono.workspace = true
slint.workspace = true
open.workspace = true
arboard = { version = "3.7", default-features = false }
zeroize.workspace = true
rfd = "0.15.4"
pulldown-cmark = "0.13.6"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile = "3"
